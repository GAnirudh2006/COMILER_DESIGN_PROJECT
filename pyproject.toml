[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genomedsl"
version = "0.1.0"
description = "A Domain-Specific Programming Language for DNA, RNA and Protein Sequence Analysis"
readme = "README.md"
authors = [
    { name = "G Anirudh", email = "anirudh.g2024@vitstudent.ac.in" },
    { name = "Abhishek Kothari", email = "abhishek.kothari2024@vitstudent.ac.in" }
]
requires-python = ">=3.9"
dependencies = [
    "lark>=1.1.0",
    "biopython>=1.80",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
genomedsl = "genomedsl.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
